  camera_hof_live: str?
  camera_hof_stream: str?
  camera_hof_person_sensor: str?

  camera_hof_von_garage_name: str?
  camera_hof_von_garage_event_image: str?
  camera_hof_von_garage_live: str?
  camera_hof_von_garage_stream: str?
  camera_hof_von_garage_person_sensor: str?

  camera_werkstatt_garten_name: str?
