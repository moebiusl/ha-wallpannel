name: "HA Wallpanel"
description: "Touch-optimiertes Home-Assistant-Wallpanel fuer iPad und Tablet."
version: "1.3.4"
slug: "wallpanel"
init: false

arch:
  - aarch64
  - amd64

startup: application
boot: auto
homeassistant_api: true
hassio_api: true
hassio_role: manager

ingress: true
ingress_port: 3000
panel_icon: mdi:tablet-dashboard
webui: "http://[HOST]:[PORT:3000]"

ports:
  3000/tcp: 3000

ports_description:
  3000/tcp: "Wallpanel Weboberflaeche"

options:
  ha_url: ""
  ha_token: ""
  go2rtc_public_url: ""
  go2rtc_port: "1984"
  settings_pin: "1310"

  entity_light_main: "light.hof"
  entity_light_secondary: "light.stehlampe"
  entity_light_third: ""

  camera_einfahrt_name: "Einfahrt"
  camera_einfahrt_event_image: "image.einfahrt_event_image"
  camera_einfahrt_live: "camera.einfahrt"
  camera_einfahrt_stream: ""
  camera_einfahrt_person_sensor: "sensor.einfahrt_person_name"

  camera_hof_name: "Hof"
  camera_hof_event_image: "image.hof_event_image"
  camera_hof_live: "camera.hof"
  camera_hof_stream: ""
  camera_hof_person_sensor: "sensor.hof_person_name"

  camera_hof_von_garage_name: "Hof von Garage"
  camera_hof_von_garage_event_image: "image.hof_von_garage_event_image"
  camera_hof_von_garage_live: "camera.hof_von_garage"
  camera_hof_von_garage_stream: ""
  camera_hof_von_garage_person_sensor: "sensor.hof_von_garage_person_name"

  camera_werkstatt_garten_name: "Werkstatt Garten"
  camera_werkstatt_garten_event_image: "image.werkstatt_richtung_garten_event_image"
  camera_werkstatt_garten_live: "camera.werkstatt_richtung_garten"
  camera_werkstatt_garten_stream: ""
  camera_werkstatt_garten_person_sensor: "sensor.werkstatt_richtung_garten_person_name"

  camera_klingel_name: "Klingel"
  camera_klingel_event_image: "image.klingel_event_image"
  camera_klingel_live: "camera.klingel"
  camera_klingel_stream: ""

schema:
  ha_url: str?
  ha_token: password?
  go2rtc_public_url: str?
  go2rtc_port: str?
  settings_pin: str?

  entity_light_main: str?
  entity_light_secondary: str?
  entity_light_third: str?

  camera_einfahrt_name: str?
  camera_einfahrt_event_image: str?
  camera_einfahrt_live: str?
  camera_einfahrt_stream: str?
  camera_einfahrt_person_sensor: str?

  camera_hof_name: str?
