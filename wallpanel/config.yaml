name: "HA Wallpanel"
description: "Touch-optimiertes Home-Assistant-Wallpanel fuer iPad und Tablet."
version: "1.0.0"
slug: "wallpanel"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
