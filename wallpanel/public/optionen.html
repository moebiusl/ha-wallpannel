<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>HA Wallpanel - Optionen</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="optionen" data-room="hof">
  <div class="app-shell">
    <div id="headerMount"></div>

    <div class="layout">
      <main class="dashboard-main single-page-main">
        <section class="single-page-grid">
          <article class="panel large-page-panel settings-panel">
            <div class="panel-header">
              <span class="panel-kicker">Optionen</span>
              <span class="panel-meta">iPad Konfiguration</span>
            </div>

            <div class="settings-section">
              <div class="settings-title">Sichtbare Seiten</div>
              <label class="settings-check"><input type="checkbox" checked> <span>Home anzeigen</span></label>
              <label class="settings-check"><input type="checkbox" checked> <span>Energie anzeigen</span></label>
              <label class="settings-check"><input type="checkbox" checked> <span>Sicherheit anzeigen</span></label>
            </div>

            <div class="settings-section">
              <label class="select-label" for="defaultRoom">Raum dieses iPads</label>
              <select id="defaultRoom" class="room-select">
                <option value="hof">Hof</option>
                <option value="kueche">Küche</option>
                <option value="wohnzimmer">Wohnzimmer</option>
                <option value="badezimmer">Badezimmer</option>
                <option value="schlafzimmer">Schlafzimmer</option>
                <option value="garage">Garage</option>
                <option value="buero">Büro</option>
                <option value="garten">Garten</option>
              </select>
            </div>

            <div class="settings-actions">
              <button class="pill-button active" type="button">Speichern</button>
            </div>
          </article>
        </section>
      </main>

      <div id="footerMount"></div>
    </div>
  </div>

  <script src="layout.js"></script>
  <script src="app.js"></script>
</body>
</html>
