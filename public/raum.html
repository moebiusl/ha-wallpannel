<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>HA Wallpanel - Raum</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Wallpanel">
  <meta name="theme-color" content="#09111f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="raum" data-room="hof">
  <div class="app-shell">
    <div id="headerMount"></div>

    <div class="layout">
      <main class="dashboard-main single-page-main">
        <section class="single-page-grid">
          <article class="panel large-page-panel room-page-panel dynamic-room-panel">
            <div class="panel-header">
              <span class="panel-kicker">Raum</span>
              <span id="roomUpdateState" class="panel-meta">Lade...</span>
            </div>

            <h1 id="roomTitle" class="dynamic-room-title">Raum</h1>
            <div id="roomPinnedStatus" class="room-pinned-status"></div>
            <div id="roomCardsMount" class="dynamic-card-grid"></div>
            <div id="roomLoadingOverlay" class="room-loading-overlay">
              <div class="room-loading-spinner"></div>
              <div class="room-loading-title">Lade Raum...</div>
            </div>
          </article>
        </section>
      </main>
    </div>
  </div>

  <script src="icons.js"></script>
  <script src="layout.js"></script>
  <script src="api.js"></script>
  <script src="room-page.js"></script>
</body>
</html>
