<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>HA Wallpanel - Wetter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Wallpanel">
  <meta name="theme-color" content="#09111f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <script>
    // Design vor dem ersten Zeichnen setzen (kein Aufblitzen). ?theme=home zum Ausprobieren.
    (function () {
      var theme = '';
      try { theme = window.localStorage.getItem('haWallpanel.theme') || ''; } catch (e) { theme = ''; }
      var preview = /[?&]theme=([a-z]+)/.exec(window.location.search);
      if (preview) { theme = preview[1]; }
      if (theme && theme !== 'classic') { document.documentElement.className += ' theme-' + theme; }
    })();
  </script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="theme-home.css">
</head>
<body data-page="wetter" data-room="hof">
  <div class="app-shell">
    <div id="headerMount"></div>

    <div class="layout">
      <main class="dashboard-main">
        <section class="single-page-grid">
          <article class="panel large-page-panel weather-page-panel">
            <div class="panel-header">
              <span class="panel-kicker">Wetter</span>
              <span id="weatherStationUpdateState" class="panel-meta weather-station-update-meta">Lade...</span>
            </div>

            <div id="weatherStationSections" class="energy-sections"></div>
          </article>
        </section>
      </main>
    </div>
  </div>

  <script src="icons.js"></script>
  <script src="layout.js"></script>
  <script src="api.js"></script>
  <script src="wetter.js"></script>
</body>
</html>
